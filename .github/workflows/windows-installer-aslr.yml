# Throwaway test for openscad/openscad#7228: minimal NSIS 3.06.1 amd64 installers built
# like MXE does (a), with stubs linked without relocations (b), and with makensis fixed to
# update the base relocation directory and section file offsets when it moves sections (c), run with and without
# mandatory ASLR (ForceRelocateImages).
name: Windows installer ASLR test

on:
  workflow_dispatch:
  push:
    branches: [ windows-installer-aslr ]

jobs:
  aslr:
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-2025, windows-2022 ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Run the test installers
        shell: pwsh
        run: |
          $results = @()
          foreach ($mitigation in 'none', 'force-relocate') {
            foreach ($v in 'a', 'b', 'c') {
              $name = "test-$v-$mitigation.exe"
              Copy-Item "nsis-test\test-$v.exe" $name
              if ($mitigation -ne 'none') { Set-ProcessMitigation -Name $name -Enable ForceRelocateImages }
              $out = "$env:TEMP\nsistest"
              Remove-Item -Recurse -Force $out -ErrorAction SilentlyContinue
              try {
                $p = Start-Process -FilePath ".\$name" -PassThru -ErrorAction Stop
                Wait-Process -Id $p.Id -Timeout 30 -ErrorAction SilentlyContinue
                if ($p.HasExited) { $code = '0x{0:X8}' -f $p.ExitCode } else { $code = 'HUNG'; Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
              } catch { $code = "START FAILED: $($_.Exception.Message)" }
              $results += [pscustomobject]@{ variant = $v; mitigation = $mitigation; exitcode = $code; installed = (Test-Path "$out\ok.ini") }
            }
          }
          $results | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
          Get-WinEvent -FilterHashtable @{LogName='System'; StartTime=(Get-Date).AddMinutes(-10)} -ErrorAction SilentlyContinue |
            Where-Object { $_.ProviderName -match 'Popup' } | Select-Object TimeCreated, Message | Format-List | Out-String -Width 300 | Write-Host
