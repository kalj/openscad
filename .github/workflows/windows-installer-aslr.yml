# Throwaway test for openscad/openscad#7228: does the Windows installer fail to
# start with 0xC000007B when mandatory ASLR is enforced for it?
name: Windows installer ASLR test

on:
  workflow_dispatch:
  push:
    branches: [ windows-installer-aslr ]

jobs:
  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-2025, windows-2022 ]
        mitigation: [ none, force-relocate ]
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} ${{ matrix.mitigation }}
    steps:
      - name: Download installers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dl | Out-Null
          $rc = 'https://github.com/openscad/openscad/releases/download/openscad-2026.11-RC0/OpenSCAD-2026.11-RC0-x86-64-Installer.exe'
          Invoke-WebRequest $rc -OutFile dl/rc0.exe
          $sha = (Get-FileHash dl/rc0.exe -Algorithm SHA256).Hash.ToLower()
          if ($sha -ne '0a33aa8a7a1455e66d2ec2fb7c430b6728b79c25222ff0383f5bbb8cd75f504d') { throw 'RC0 checksum mismatch' }
          try {
            $list = (Invoke-WebRequest 'https://files.openscad.org/snapshots/' -UseBasicParsing).Content
            $latest = [regex]::Matches($list, 'OpenSCAD-[0-9.]+-x86-64-Installer\.exe') | ForEach-Object { $_.Value } | Sort-Object -Unique | Select-Object -Last 1
            Write-Host "Newest snapshot installer: $latest"
            Invoke-WebRequest "https://files.openscad.org/snapshots/$latest" -OutFile dl/snapshot.exe
          } catch { Write-Host "Could not get a snapshot installer: $_" }

      - name: PE headers
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem dl -Filter *.exe) {
            $b = [System.IO.File]::ReadAllBytes($f.FullName)
            $pe = [BitConverter]::ToInt32($b, 0x3C)
            $machine = [BitConverter]::ToUInt16($b, $pe + 4)
            $chars = [BitConverter]::ToUInt16($b, $pe + 0x16)
            $opt = $pe + 0x18
            $magic = [BitConverter]::ToUInt16($b, $opt)
            $dllchars = [BitConverter]::ToUInt16($b, $opt + 0x46)
            $ddir = $opt + $(if ($magic -eq 0x20b) { 0x70 } else { 0x60 })
            $relocSize = [BitConverter]::ToUInt32($b, $ddir + 5 * 8 + 4)
            Write-Host ("{0}: machine=0x{1:X4} PE{2} RELOCS_STRIPPED={3} DYNAMIC_BASE={4} NX_COMPAT={5} reloc_dir_size={6}" -f `
              $f.Name, $machine, $(if ($magic -eq 0x20b) { '32+' } else { '32' }), [bool]($chars -band 1), [bool]($dllchars -band 0x40), [bool]($dllchars -band 0x100), $relocSize)
          }

      - name: Set mitigation
        if: matrix.mitigation != 'none'
        shell: pwsh
        run: |
          foreach ($n in 'rc0.exe', 'snapshot.exe') {
            if ('${{ matrix.mitigation }}' -eq 'force-relocate') {
              Set-ProcessMitigation -Name $n -Enable ForceRelocateImages
            } else {
              Set-ProcessMitigation -Name $n -Enable ForceRelocateImages, RequireInfo
            }
            Get-ProcessMitigation -Name $n | Select-Object -ExpandProperty Aslr | Format-List | Out-String | Write-Host
          }

      - name: Run installers
        shell: pwsh
        run: |
          function Show-PE($path) {
            try {
              $b = [System.IO.File]::ReadAllBytes($path)
              if ($b.Length -lt 0x40 -or $b[0] -ne 0x4D -or $b[1] -ne 0x5A) { return }
              $pe = [BitConverter]::ToInt32($b, 0x3C)
              $machine = [BitConverter]::ToUInt16($b, $pe + 4)
              $chars = [BitConverter]::ToUInt16($b, $pe + 0x16)
              $opt = $pe + 0x18
              $magic = [BitConverter]::ToUInt16($b, $opt)
              $dllchars = [BitConverter]::ToUInt16($b, $opt + 0x46)
              $ddir = $opt + $(if ($magic -eq 0x20b) { 0x70 } else { 0x60 })
              $relocSize = [BitConverter]::ToUInt32($b, $ddir + 5 * 8 + 4)
              Write-Host ("  {0}: machine=0x{1:X4} RELOCS_STRIPPED={2} DYNAMIC_BASE={3} reloc_dir_size={4}" -f $path, $machine, [bool]($chars -band 1), [bool]($dllchars -band 0x40), $relocSize)
            } catch {}
          }
          $start = Get-Date
          foreach ($f in Get-ChildItem dl -Filter *.exe) {
            $name = $f.BaseName
            $dir = "C:\osc-$name"
            Write-Host "=== $name (${{ matrix.mitigation }})"
            $before = Get-Process | Select-Object -ExpandProperty Id
            $p = Start-Process -FilePath $f.FullName -ArgumentList '/S', "/D=$dir" -PassThru
            if (Wait-Process -Id $p.Id -Timeout 90 -ErrorAction SilentlyContinue; $p.HasExited) {
              Write-Host ("exit code: 0x{0:X8}, installed: {1}" -f $p.ExitCode, (Test-Path "$dir\openscad.exe"))
            } else {
              Write-Host "HUNG after 90 s. New processes:"
              Get-CimInstance Win32_Process | Where-Object { $before -notcontains $_.ProcessId } |
                Select-Object ProcessId, ParentProcessId, Name, ExecutablePath, CommandLine | Format-List | Out-String -Width 300 | Write-Host
              Write-Host "Windows with titles:"
              Get-Process | Where-Object { $_.MainWindowTitle } | Select-Object Id, ProcessName, MainWindowTitle | Format-Table -AutoSize | Out-String -Width 300 | Write-Host
              Write-Host "PE headers of files extracted to TEMP:"
              Get-ChildItem $env:TEMP -Recurse -Include *.exe, *.dll -ErrorAction SilentlyContinue |
                Where-Object { $_.LastWriteTime -gt $start.AddMinutes(-1) } | ForEach-Object { Show-PE $_.FullName }
              Write-Host "PE headers in the install dir:"
              Get-ChildItem $dir -Recurse -Include *.exe -ErrorAction SilentlyContinue | Select-Object -First 20 | ForEach-Object { Show-PE $_.FullName }
              Get-Process | Where-Object { $before -notcontains $_.Id } | Stop-Process -Force -ErrorAction SilentlyContinue
            }
          }
          Write-Host "=== Mitigation event logs"
          foreach ($log in 'Microsoft-Windows-Security-Mitigations/UserMode', 'Microsoft-Windows-Security-Mitigations/KernelMode') {
            Get-WinEvent -LogName $log -MaxEvents 20 -ErrorAction SilentlyContinue | Where-Object { $_.TimeCreated -gt $start } |
              Select-Object TimeCreated, Id, Message | Format-List | Out-String -Width 300 | Write-Host
          }
          Write-Host "=== Application errors"
          Get-WinEvent -FilterHashtable @{LogName='Application'; Level=2; StartTime=$start} -ErrorAction SilentlyContinue |
            Select-Object -First 10 TimeCreated, ProviderName, Message | Format-List | Out-String -Width 300 | Write-Host
          Write-Host "=== System log (popups/hard errors)"
          Get-WinEvent -FilterHashtable @{LogName='System'; StartTime=$start} -ErrorAction SilentlyContinue | Where-Object { $_.ProviderName -match 'Popup|Application Popup' } |
            Select-Object -First 10 TimeCreated, ProviderName, Message | Format-List | Out-String -Width 300 | Write-Host
