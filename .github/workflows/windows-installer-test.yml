# Throwaway test for openscad/openscad#7228: does the Windows installer start
# and install on a clean machine? Runs the RC0 installer and the newest
# snapshot installer silently, then runs the installed openscad.
name: Windows installer test

on:
  workflow_dispatch:
  push:
    branches: [ windows-installer-test ]

jobs:
  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-2025, windows-2022 ]
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}
    steps:
      - name: Download installers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dl | Out-Null
          $rc = 'https://github.com/openscad/openscad/releases/download/openscad-2026.11-RC0/OpenSCAD-2026.11-RC0-x86-64-Installer.exe'
          Invoke-WebRequest $rc -OutFile dl/rc0.exe
          $sha = (Get-FileHash dl/rc0.exe -Algorithm SHA256).Hash.ToLower()
          Write-Host "rc0.exe sha256 $sha"
          if ($sha -ne '0a33aa8a7a1455e66d2ec2fb7c430b6728b79c25222ff0383f5bbb8cd75f504d') { throw 'RC0 checksum mismatch' }
          try {
            $list = (Invoke-WebRequest 'https://files.openscad.org/snapshots/' -UseBasicParsing).Content
            $names = [regex]::Matches($list, 'OpenSCAD-[0-9.]+-x86-64-Installer\.exe') | ForEach-Object { $_.Value } | Sort-Object -Unique
            $latest = $names | Select-Object -Last 1
            Write-Host "Newest snapshot installer: $latest"
            Invoke-WebRequest "https://files.openscad.org/snapshots/$latest" -OutFile dl/snapshot.exe
          } catch {
            Write-Host "Could not get a snapshot installer: $_"
          }
          Get-ChildItem dl | Format-Table Name, Length

      - name: Run installers
        shell: pwsh
        run: |
          'cube(10);' | Out-File -Encoding ascii test.scad
          $results = @()
          foreach ($f in Get-ChildItem dl -Filter *.exe) {
            $name = $f.BaseName
            $dir = "C:\osc-$name"
            Write-Host "=== $name"
            $p = Start-Process -FilePath $f.FullName -ArgumentList '/S', "/D=$dir" -Wait -PassThru
            $code = '0x{0:X8}' -f $p.ExitCode
            Write-Host "installer exit code: $($p.ExitCode) ($code)"
            $exe = Test-Path "$dir\openscad.exe"
            $com = Test-Path "$dir\openscad.com"
            $version = ''
            $export = $false
            if ($com) {
              $version = (& "$dir\openscad.com" --version 2>&1 | Out-String).Trim()
              & "$dir\openscad.com" -o "$name.stl" test.scad 2>&1 | Out-Host
              $export = Test-Path "$name.stl"
            }
            $results += [pscustomobject]@{ installer = $name; exitcode = $code; openscad_exe = $exe; openscad_com = $com; version = $version; export_ok = $export }
          }
          $results | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
          $results | ConvertTo-Json | Out-File results.json
          Get-WinEvent -FilterHashtable @{LogName='Application'; Level=2; StartTime=(Get-Date).AddMinutes(-30)} -ErrorAction SilentlyContinue |
            Select-Object -First 10 TimeCreated, ProviderName, Message | Format-List | Out-String -Width 200 | Write-Host
